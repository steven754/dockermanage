services:
  panel:
    # 生产环境建议钉死版本号，避免某次 pull 静默换掉版本：
    #   PANEL_IMAGE=stevensign/dockermanage:v0.1.0 docker compose up -d
    image: "${PANEL_IMAGE:-stevensign/dockermanage:latest}"
    container_name: dockermanage
    restart: unless-stopped

    # exec 容器终端 / inspect 进程所需（个人自用场景的合理妥协，
    # 企业部署请改用 Docker Socket Proxy，见 SPEC §8.1）
    privileged: true

    ports:
      - "8080:8080"

    volumes:
      # Docker daemon socket —— 后端通过它管理容器
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 数据库 + 设置 + 初始密码 + JWT 密钥
      - ./data:/data
      # Compose 项目目录（每个子目录 = 一个项目）
      - ./compose:/compose

    environment:
      PANEL_PORT: "8080"
      PANEL_DATA: "/data"
      PANEL_COMPOSE_DIR: "/compose"
      PANEL_LOG_LEVEL: "info"
      # 首启初始密码，默认 admin。改成 "random" 则生成 16 位随机密码；
      # 改成具体字符串则用该值。首次登录后系统会强制改密。
      PANEL_INITIAL_PASSWORD: "${PANEL_INITIAL_PASSWORD:-admin}"
      # 是否采信 X-Forwarded-For / X-Real-IP。仅在面板确实部署在反向代理
      # 之后时才设为 true；直连时保持 false，否则登录限流可被伪造头绕过。
      PANEL_TRUST_PROXY: "${PANEL_TRUST_PROXY:-false}"
      # 每分钟允许的登录尝试次数。注意容器化部署时该阈值是全局的
      # （所有请求来源地址相同），偶尔输错密码可以调大一些。
      PANEL_LOGIN_RATE_LIMIT: "${PANEL_LOGIN_RATE_LIMIT:-10}"
      TZ: "${TZ:-Asia/Shanghai}"

    # 镜像健康检查
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
